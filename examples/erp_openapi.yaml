openapi: 3.0.3
info: {title: Fictional ERP Orders API, version: 1.0.0}
paths:
  /orders:
    post:
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Order'}
      responses:
        '201': {description: created}
    get:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Order'}}
  /orders/{id}:
    get:
      responses:
        '200':
          description: success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
  /orders/{id}/ship:
    post:
      responses:
        '200': {description: shipped}
components:
  schemas:
    Order:
      type: object
      required: [id, account_id, quantity]
      properties:
        id: {type: string}
        account_id: {type: string}
        quantity: {type: integer, minimum: 1}
        status: {type: string, enum: [pending, shipped]}
